[workspace]
name = "geo-viz-tutorial"
version = "0.1.0"
description = "Environment for Lecture 27: Geospatial Visualization in Python (GEOG 213/313)"
channels = ["conda-forge"]
platforms = ["osx-arm64", "osx-64", "linux-64", "win-64"]

[dependencies]
python = "3.12.*"
jupyterlab = "*"
geopandas = ">=1.1"
pyogrio = "*"
libgdal-core = ">=3.10"
matplotlib = ">=3.10"
xarray = "*"
netcdf4 = "*"
pooch = "*"
mapclassify = "*"
cmcrameri = "*"
colorspacious = "*"
folium = "*"
lonboard = ">=0.16"
leafmap = ">=0.60"
# leafmap 0.64 map widgets break with ipyvuetify 3 (ExpansionPanelHeader was removed)
ipyvuetify = "<3"
maplibre = "*"
mercantile = "*"
pmtiles = ">=3.4"
mapbox-vector-tile = "*"
obstore = "*"
requests = "*"

[pypi-dependencies]
async-pmtiles = "*"

[tasks]
lab = "jupyter lab"
